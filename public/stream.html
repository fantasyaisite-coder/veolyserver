<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Flow Remote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
#viewer{position:relative;max-width:100vw;max-height:100vh;cursor:crosshair}
#viewer img{display:block;width:100%;height:auto;max-height:100vh;object-fit:contain}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#555;font-size:14px;z-index:10;flex-direction:column;gap:12px}
#loading.hidden{display:none}
.spinner{width:32px;height:32px;border:3px solid #222;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toolbar{position:fixed;top:10px;right:10px;z-index:20;display:flex;gap:6px}
#toolbar button{background:rgba(20,20,20,.8);color:#aaa;border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
#toolbar button:hover{background:#222;color:#fff}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Connecting to Flow...</span>
</div>

<div id="toolbar">
  <button id="refreshBtn">Refresh</button>
</div>

<div id="viewer">
  <img id="screen" alt="Flow Remote Viewport" draggable="false"/>
</div>

<script>
const protocol = location.protocol === "https:" ? "wss:" : "ws:";
const wsUrl = `${protocol}//${location.host}/ws-stream`;
let ws = null;
let viewWidth = 1280;
let viewHeight = 900;
let connected = false;

function connect() {
  if (ws) ws.close();
  ws = new WebSocket(wsUrl);
  document.getElementById("loading").classList.remove("hidden");

  ws.onopen = () => {
    console.log("WS connected");
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "viewport") {
        viewWidth = msg.width;
        viewHeight = msg.height;
      } else if (msg.type === "frame") {
        document.getElementById("screen").src = "data:image/jpeg;base64," + msg.data;
        document.getElementById("loading").classList.add("hidden");
        if (!connected) {
          connected = true;
          console.log("Stream started");
        }
      }
    } catch (_) {}
  };

  ws.onclose = () => {
    connected = false;
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("loading").querySelector("span").textContent = "Disconnected. Reconnecting...";
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

// Mouse events
const viewer = document.getElementById("viewer");
const img = document.getElementById("screen");

function getPos(e) {
  const rect = img.getBoundingClientRect();
  const x = (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left;
  const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top;
  return { x, y, viewWidth: rect.width, viewHeight: rect.height };
}

function send(type, data) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type, ...data }));
}

// Mouse
img.addEventListener("click", (e) => send("click", getPos(e)));
img.addEventListener("mousemove", (e) => send("mousemove", getPos(e)));
img.addEventListener("wheel", (e) => { e.preventDefault(); send("wheel", { deltaX: e.deltaX, deltaY: e.deltaY }); }, { passive: false });

// Touch
img.addEventListener("touchstart", (e) => { e.preventDefault(); send("click", getPos(e)); }, { passive: false });
img.addEventListener("touchmove", (e) => { e.preventDefault(); send("mousemove", getPos(e)); }, { passive: false });

// Keyboard
document.addEventListener("keydown", (e) => { send("key", { key: e.key, keyCode: e.keyCode, down: true }); e.preventDefault(); });
document.addEventListener("keyup", (e) => { send("key", { key: e.key, keyCode: e.keyCode, down: false }); e.preventDefault(); });

document.getElementById("refreshBtn").addEventListener("click", () => {
  location.reload();
});

connect();
</script>
</body>
</html>
